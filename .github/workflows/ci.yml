name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - name: Call log is append-only (chain, snapshots, and no edits to past rows versus main)
        run: |
          git fetch origin main --depth=1000 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            python scripts/check_call_log.py --base origin/main --strict
          else
            python scripts/check_call_log.py
          fi
      - run: python -m pytest -q

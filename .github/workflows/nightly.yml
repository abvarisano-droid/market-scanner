name: nightly
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Universe
        run: python universe.py --refresh
      - name: Fetch prices
        run: python prices.py
      - name: Scan
        run: python scan.py
      - name: Track
        run: python track.py
      - name: Commit results
        run: |
          git config user.name "market-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out data
          git diff --cached --quiet || git commit -m "nightly: scan $(date -u +%F)"
          git pull --rebase
          git push

name: Daily scan
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 5:30pm ET weekdays, after US close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python run_scan.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "market-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data/picks.csv data/latest_scan.json
          git commit -m "Daily scan $(date +%F)" || echo "nothing to commit"
          git push

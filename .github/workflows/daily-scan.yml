name: Daily scan
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 5:30pm ET weekdays, after US close
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - name: Scan
        run: python run_scan.py
        env:
          # Optional. Without it the scan uses the rules model for the "why" text.
          ANTHROPIC_API_KEY: ${{ secrets.MARKET_TEAM_ANTHROPIC_API_KEY }}
      - name: Export site data
        run: python scripts/export_site.py
      - name: Tests
        run: python -m pytest -q
      - name: Commit reports, picks and site data
        run: |
          git config user.name "market-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data/picks.csv data/latest_scan.json site/data
          git commit -m "Daily scan $(date +%F)" || echo "nothing to commit"
          git pull --rebase
          git push

name: Scan watchdog
on:
  schedule:
    - cron: "7 13 * * 1-6"   # 13:07 UTC Mon to Sat, after the 12:00 UTC deadline for the previous trading day (Saturday catches a missed Friday)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan-watchdog
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: repo-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check recent scans (reads git log only, no secrets, no network)
        id: check
        run: python -m scanner.watchdog
        continue-on-error: true
      - name: Commit watchdog.json
        run: |
          git config user.name "market-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/watchdog.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Watchdog $(date +%F)"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Fail if a scan was missed
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Nightly scan missed. See site/data/watchdog.json for the dates."
          exit 1
